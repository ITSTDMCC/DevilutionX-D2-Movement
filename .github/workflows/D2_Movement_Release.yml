# Part of DevilutionX-D2-Movement. Builds the Windows download players use, the same way upstream
# DevilutionX packages its Windows release: devilutionx.exe, DevilutionX's own devilutionx.mpq, and SDL2.dll.
# No Diablo or Diablo 2 game files are involved; players add their own DIABDAT.MPQ.
#
# Pushing a tag like v0.1.0 builds the zip and publishes it as a GitHub Release.
# Pushing the branch, or running the workflow by hand (Actions tab), only builds it and keeps the zip
# as a run artifact, so the build can be checked before anything is published.
name: D2 Movement Windows release

on:
  push:
    branches:
      - d2-movement-parity
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-x64:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Create build environment
      run: >
        sudo apt-get update &&
        sudo apt-get install -y cmake gcc-mingw-w64-x86-64 g++-mingw-w64-x86-64 pkg-config-mingw-w64-x86-64 libz-mingw-w64-dev gettext dpkg-dev wget git sudo smpq zip &&
        sudo rm /usr/x86_64-w64-mingw32/lib/libz.dll.a &&
        sudo Packaging/windows/mingw-prep64.sh

    - name: Configure
      run: cmake -S. -Bbuild -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF -DCPACK=ON -DCMAKE_TOOLCHAIN_FILE=../CMake/platforms/mingwcc64.toolchain.cmake -DDEVILUTIONX_SYSTEM_BZIP2=OFF -DDEVILUTIONX_STATIC_LIBSODIUM=ON -DDISCORD_INTEGRATION=OFF

    - name: Build and package
      run: cmake --build build -j $(nproc) --target package

    - name: Add mod notes and name the zip
      run: |
        name="DevilutionX-D2-Movement-${GITHUB_REF_NAME//\//-}-windows-x64"
        mkdir -p stage/devilutionx
        cp tools/d2harness/PLAYING.txt stage/devilutionx/README-D2MOVEMENT.txt
        cp NOTICE-D2MOVEMENT.md LICENSE.md stage/devilutionx/
        cp build/devilutionx.zip "$name.zip"
        (cd stage && zip -r "../$name.zip" devilutionx)
        # Guard: a release must never contain game data
        if unzip -l "$name.zip" | grep -iE 'diabdat|spawn\.mpq|hellfire\.mpq|hf(monk|music|voice)\.mpq'; then echo "game data found in zip"; exit 1; fi
        unzip -l "$name.zip"
        echo "ZIP=$name.zip" >> "$GITHUB_ENV"

    - name: Keep the zip as a run artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.ZIP }}
        path: ${{ env.ZIP }}

    - name: Publish the GitHub Release
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v2
      with:
        files: ${{ env.ZIP }}
        body: |
          Diablo 1 with Diablo 2 movement (DevilutionX 1.5.3 based).

          1. Extract the zip anywhere.
          2. Copy `DIABDAT.MPQ` from your own copy of Diablo (CD or GOG) into the extracted folder.
             For Hellfire, also copy hellfire.mpq, hfmonk.mpq, hfmusic.mpq and hfvoice.mpq.
          3. Run `devilutionx.exe`.

          Diablo 1 pacing (walking in the dungeon, jogging in town; R toggles). Settings > Gameplay > "Diablo 2 Movement" switches back to stock Diablo 1 walking.
          This download contains no Blizzard game data.
